<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital clock + count-down bars</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f7; }
    @media (prefers-color-scheme: dark) { body { background: #111114; } }
  </style>
</head>
<body>
  <div id="clock"></div>

  <script src="../clock.js"></script>
  <script>
    new Clock('#clock', {
      displays: ['digital', 'bars'],
      layout: 'column',
      gap: 36,
      theme: 'auto',
      digital: {
        size: 80
      },
      bars: {
        length: 320
      }
    });
  </script>
</body>
</html>
