<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown timer</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f7; color: #1d1d1f; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #111114; color: #f2f2f4; } }
    main { display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .presets button { padding: 8px 16px; border: 1px solid #8e8e93; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-size: 15px; cursor: pointer; }

    /* The alarm badge can be styled like any other element. */
    #timer .clock-alarm { font-size: 22px; }
  </style>
</head>
<body>
  <main>
    <div id="timer"></div>
    <div class="presets">
      <button type="button" data-countdown="1m">1 min</button>
      <button type="button" data-countdown="3m">3 min</button>
      <button type="button" data-countdown="5m">5 min</button>
      <button type="button" data-countdown="10m">10 min</button>
      <button type="button" data-countdown="25m">25 min</button>
    </div>
  </main>

  <script src="../clock.js"></script>
  <script>
    // Rings when the countdown ends, and vibrates on phones that support it.
    const countdown = duration => ({
      countdown: duration,
      ringFor: 30,
      onAlarm: () => navigator.vibrate && navigator.vibrate([300, 150, 300])
    });

    const timer = new Clock('#timer', {
      displays: ['digital'],
      theme: 'auto',
      digital: { size: 72 },
      alarm: countdown('3m')
    });

    document.querySelectorAll('[data-countdown]').forEach(button => {
      button.addEventListener('click', () => timer.setAlarm(countdown(button.dataset.countdown)));
    });
  </script>
</body>
</html>
