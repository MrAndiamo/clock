<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World clocks</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f7; }
    @media (prefers-color-scheme: dark) { body { background: #111114; } }
    .world { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; }
  </style>
</head>
<body>
  <!-- No JavaScript needed: clock.js starts every element with a data-clock attribute. -->
  <div class="world">
    <div data-clock='{"displays": ["analog", "digital"], "layout": "column", "gap": 20, "theme": "auto",
                      "label": "Amsterdam", "timeZone": "Europe/Amsterdam",
                      "analog": {"size": 170, "numbers": "none"}, "digital": {"size": 28, "seconds": false}}'></div>
    <div data-clock='{"displays": ["analog", "digital"], "layout": "column", "gap": 20, "theme": "auto",
                      "label": "New York", "timeZone": "America/New_York",
                      "analog": {"size": 170, "numbers": "none"}, "digital": {"size": 28, "seconds": false}}'></div>
    <div data-clock='{"displays": ["analog", "digital"], "layout": "column", "gap": 20, "theme": "auto",
                      "label": "Tokyo", "timeZone": "Asia/Tokyo",
                      "analog": {"size": 170, "numbers": "none"}, "digital": {"size": 28, "seconds": false}}'></div>
  </div>

  <script src="../clock.js"></script>
</body>
</html>
