<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical bars, counting up</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f7; }
    @media (prefers-color-scheme: dark) { body { background: #111114; } }
  </style>
</head>
<body>
  <div id="clock"></div>

  <script src="../clock.js"></script>
  <script>
    new Clock('#clock', {
      displays: ['bars'],
      theme: 'auto',
      label: 'Elapsed today',
      bars: {
        orientation: 'vertical',
        direction: 'up',
        length: 220,
        thickness: 34,
        rounded: false
      }
    });
  </script>
</body>
</html>
