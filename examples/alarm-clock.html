<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm clock</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f7; color: #1d1d1f; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #111114; color: #f2f2f4; } }
    main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    form { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
    input, button { padding: 6px 12px; border: 1px solid #8e8e93; border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div id="clock"></div>
    <form id="alarm-form">
      <label for="alarm-time">Alarm</label>
      <input id="alarm-time" type="time" value="07:00" required>
      <button type="submit">Set</button>
      <button type="button" id="alarm-off">Off</button>
    </form>
  </main>

  <script src="../clock.js"></script>
  <script>
    // Rings every day at `time`, with a Snooze button that waits 5 minutes.
    const wakeUp = time => ({ time: time, label: 'Wake up', repeat: true, snooze: 5 });

    const clock = new Clock('#clock', {
      displays: ['analog', 'digital'],
      layout: 'column',
      gap: 20,
      theme: 'auto',
      analog: { size: 240 },
      digital: { size: 40, seconds: false },
      alarm: wakeUp('07:00')
    });

    document.getElementById('alarm-form').addEventListener('submit', event => {
      event.preventDefault();
      clock.setAlarm(wakeUp(document.getElementById('alarm-time').value));
    });
    document.getElementById('alarm-off').addEventListener('click', () => clock.setAlarm(null));
  </script>
</body>
</html>
