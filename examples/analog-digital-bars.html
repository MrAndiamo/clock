<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog + digital clock + count-down bars</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f7; }
    @media (prefers-color-scheme: dark) { body { background: #111114; } }
  </style>
</head>
<body>
  <div id="clock"></div>

  <script src="../clock.js"></script>
  <script>
    // The nested array is a group: digital and bars are stacked
    // in a column, next to the analog clock.
    new Clock('#clock', {
      displays: ['analog', ['digital', 'bars']],
      layout: 'row',
      gap: 56,
      theme: 'auto',
      analog: {
        size: 260
      },
      digital: {
        size: 56,
        date: 'long'
      },
      bars: {
        length: 220
      }
    });
  </script>
</body>
</html>
